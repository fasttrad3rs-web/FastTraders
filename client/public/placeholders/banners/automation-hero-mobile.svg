<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 1000" width="828" height="1000" role="img" aria-label="PLC, HMI and VFD automation">
  <!--
    Portrait crop of the hero, for phones. 828x1000, matching the admin hint.

    No words anywhere in the artwork — see switchgear-hero-mobile.svg for why.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0F1B4C"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#00AEEF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="828" height="1000" fill="url(#bg)"/>
  <rect width="828" height="1000" fill="url(#grid)"/>

  <g fill="none" stroke="#00AEEF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <!-- Controller with an HMI screen and an I/O row. -->
    <g transform="translate(214 240)">
      <rect x="0" y="0" width="400" height="266" rx="16"/>
      <rect x="34" y="40" width="160" height="106" rx="8"/>
      <path d="M234 40h132M234 82h132M234 124h84"/>
      <path d="M34 200h332"/>
      <circle cx="60" cy="200" r="9" fill="#00AEEF" stroke="none"/>
      <circle cx="112" cy="200" r="9" fill="#00AEEF" stroke="none"/>
      <circle cx="164" cy="200" r="9" fill="#00AEEF" stroke="none"/>
    </g>

    <!-- A drive beside it, so the lower half carries weight too. -->
    <g transform="translate(294 590)">
      <rect x="0" y="0" width="240" height="300" rx="16"/>
      <rect x="34" y="38" width="172" height="72" rx="8"/>
      <path d="M34 160h172M34 206h172M34 252h104"/>
    </g>
  </g>
</svg>
