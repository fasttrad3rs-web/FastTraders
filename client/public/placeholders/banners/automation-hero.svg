<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="PLC, HMI and VFD automation">
  <!-- 16:10, matching the hero slot. See switchgear-hero.svg for the rationale. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0F1B4C"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#00AEEF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Controller with an HMI screen, an I/O rail and a drive beside it. -->
  <g fill="none" stroke="#00AEEF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <g transform="translate(360 250)">
      <rect x="0" y="0" width="380" height="250" rx="16"/>
      <rect x="34" y="38" width="150" height="104" rx="8"/>
      <path d="M224 38h122M224 78h122M224 118h78"/>
      <path d="M34 190h312"/>
      <circle cx="58" cy="190" r="9" fill="#00AEEF" stroke="none"/>
      <circle cx="106" cy="190" r="9" fill="#00AEEF" stroke="none"/>
      <circle cx="154" cy="190" r="9" fill="#00AEEF" stroke="none"/>
    </g>

    <g transform="translate(790 250)">
      <rect x="0" y="0" width="130" height="250" rx="14"/>
      <rect x="26" y="34" width="78" height="52" rx="6"/>
      <path d="M26 124h78M26 158h78M26 192h48"/>
    </g>
  </g>

</svg>
